name: cmds
options:
  bundleIdPrefix: tokyo.n-n
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  CmdsCore:
    path: Packages/CmdsCore
targets:
  cmds:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        optional: true
    dependencies:
      - package: CmdsCore
      - framework: vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreText.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: cmds
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: cmds syncs terminals to the iOS companion over the local network.
        NSBonjourServices: [_cmds._tcp]
    settings:
      base:
        PRODUCT_NAME: cmds
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        OTHER_LDFLAGS: ["-lc++"]
  CmdsCompanion:
    type: application
    platform: iOS
    sources:
      - iOS/Sources
    dependencies:
      - package: CmdsCore
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: cmds
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: cmds connects to your Mac to mirror terminals.
        NSBonjourServices: [_cmds._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.companion
        TARGETED_DEVICE_FAMILY: "1,2"
