name: cmds
options:
  bundleIdPrefix: tokyo.n-n
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Localization (docs/internals/localization.md): English is the development language, plus Japanese.
    # Strings live in each app's Localizable.xcstrings / InfoPlist.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  CmdsCore:
    path: Packages/CmdsCore
  # SSH client for the companion's remote access (Apple's swift-nio-ssh; see Packages/CmdsSSH/Package.swift).
  CmdsSSH:
    path: Packages/CmdsSSH
schemes:
  CmdsApp:
    build:
      targets:
        cmds: all
    run:
      config: Debug
  CmdsCompanion:
    build:
      targets:
        CmdsCompanion: all
  CmdsDeviceDriver:
    build:
      targets:
        CmdsDeviceDriver: [test]
    test:
      targets:
        - CmdsDeviceDriver
targets:
  cmds:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # UI text for CmdsCore values, shared with the iOS app (docs/internals/localization.md).
      - Shared/Sources
      - path: App/Resources
        optional: true
    dependencies:
      - package: CmdsCore
      # The `cmds` CLI ships at cmds.app/Contents/Resources/bin/cmds (PATH of spawned terminals, "Install Command Line Tool…").
      - target: cmds-cli
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: bin
      - framework: vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreText.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: CoreBluetooth.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: cmds
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: cmds syncs terminals to the iOS companion over the local network.
        NSBonjourServices: [_cmds._tcp]
        NSBluetoothAlwaysUsageDescription: cmds lets the iOS companion connect over Bluetooth when Wi‑Fi is off. The connection stays end-to-end encrypted.
        # Programs running in a terminal are attributed to cmds by macOS privacy prompts (see App/cmds.entitlements).
        NSAppleEventsUsageDescription: A program running in cmds would like to use AppleScript.
        NSMicrophoneUsageDescription: A program running in cmds would like to use the microphone.
        NSCameraUsageDescription: A program running in cmds would like to use the camera.
        NSContactsUsageDescription: A program running in cmds would like to access your contacts.
        NSCalendarsUsageDescription: A program running in cmds would like to access your calendars.
        NSLocationUsageDescription: A program running in cmds would like to use your location.
        NSPhotoLibraryUsageDescription: A program running in cmds would like to access your photo library.
    settings:
      base:
        PRODUCT_NAME: cmds
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/cmds.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        # A stable signing identity keeps the firewall allowance and notification permission across rebuilds.
        DEVELOPMENT_TEAM: LY354RVYHA
        CODE_SIGN_IDENTITY: "Apple Development"
        OTHER_LDFLAGS: ["-lc++"]
        ARCHS: arm64
      configs:
        # Release builds run under the hardened runtime (required for notarization). They are still signed with
        # "Apple Development" here so local Release builds need no keychain prompt; scripts/release/build-dmg.sh
        # re-signs the app with the Developer ID certificate for distribution (docs/internals/release.md).
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Bundle Ghostty resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/vendor/ghostty/zig-out/share"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DST"
          for d in ghostty terminfo; do
            if [ -d "$SRC/$d" ]; then rsync -a --delete "$SRC/$d/" "$DST/$d/"; fi
          done
  cmds-cli:
    # Same sources as the SwiftPM `cmds` executable, built by Xcode so plain xcodebuild can bundle it.
    type: tool
    productName: cmds
    platform: macOS
    sources:
      - Packages/CmdsCore/Sources/cmds-cli
    dependencies:
      - package: CmdsCore
    settings:
      base:
        PRODUCT_NAME: cmds
        PRODUCT_MODULE_NAME: cmds_cli
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  CmdsCompanion:
    type: application
    platform: iOS
    sources:
      - iOS/Sources
      - Shared/Sources
      - iOS/Resources
    dependencies:
      - package: CmdsCore
      - package: CmdsSSH
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: cmds
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: cmds connects to your Mac to mirror terminals.
        NSBonjourServices: [_cmds._tcp]
        NSCameraUsageDescription: cmds scans the pairing QR code shown by cmds on your Mac.
        NSBluetoothAlwaysUsageDescription: cmds connects to your Mac over Bluetooth when it cannot reach it over Wi‑Fi. The connection stays end-to-end encrypted.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: LY354RVYHA
        TARGETED_DEVICE_FAMILY: "1,2"
  CmdsDeviceDriver:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iOS/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.devicedriver
        DEVELOPMENT_TEAM: LY354RVYHA
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
