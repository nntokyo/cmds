name: cmds
options:
  bundleIdPrefix: tokyo.n-n
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  CmdsCore:
    path: Packages/CmdsCore
schemes:
  CmdsApp:
    build:
      targets:
        cmds: all
    run:
      config: Debug
  CmdsCompanion:
    build:
      targets:
        CmdsCompanion: all
targets:
  cmds:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - path: App/Resources
        optional: true
    dependencies:
      - package: CmdsCore
      # The `cmds` CLI ships at cmds.app/Contents/Resources/bin/cmds (PATH of spawned terminals, "Install Command Line Tool…").
      - target: cmds-cli
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: bin
      - framework: vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreText.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: UserNotifications.framework
      - sdk: libc++.tbd
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: cmds
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: cmds syncs terminals to the iOS companion over the local network.
        NSBonjourServices: [_cmds._tcp]
    settings:
      base:
        PRODUCT_NAME: cmds
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        OTHER_LDFLAGS: ["-lc++"]
        ARCHS: arm64
    postBuildScripts:
      - name: Bundle Ghostty resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/vendor/ghostty/zig-out/share"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DST"
          for d in ghostty terminfo; do
            if [ -d "$SRC/$d" ]; then rsync -a --delete "$SRC/$d/" "$DST/$d/"; fi
          done
  cmds-cli:
    # Same sources as the SwiftPM `cmds` executable, built by Xcode so plain xcodebuild can bundle it.
    type: tool
    platform: macOS
    sources:
      - Packages/CmdsCore/Sources/cmds-cli
    dependencies:
      - package: CmdsCore
    settings:
      base:
        PRODUCT_NAME: cmds
        PRODUCT_MODULE_NAME: cmds_cli
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
  CmdsCompanion:
    type: application
    platform: iOS
    sources:
      - iOS/Sources
    dependencies:
      - package: CmdsCore
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: cmds
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: cmds connects to your Mac to mirror terminals.
        NSBonjourServices: [_cmds._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.companion
        TARGETED_DEVICE_FAMILY: "1,2"
