name: cmds
options:
  bundleIdPrefix: tokyo.n-n
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Localization (docs/internals/localization.md): English is the development language, plus Japanese.
    # Strings live in each app's Localizable.xcstrings / InfoPlist.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_LANGUAGE: en
    MARKETING_VERSION: "0.24.1"
    CURRENT_PROJECT_VERSION: "34"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  CmdsCore:
    path: Packages/CmdsCore
  # SSH client for the companion's remote access (Apple's swift-nio-ssh; see Packages/CmdsSSH/Package.swift).
  CmdsSSH:
    path: Packages/CmdsSSH
  # Automatic updates of the Mac app (docs/internals/release.md#automatic-updates).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: "2.10.1"
schemes:
  CmdsApp:
    build:
      targets:
        cmds: all
    run:
      config: Debug
  CmdsCompanion:
    build:
      targets:
        CmdsCompanion: all
  CmdsDeviceDriver:
    build:
      targets:
        CmdsDeviceDriver: [test]
    test:
      targets:
        - CmdsDeviceDriver
targets:
  cmds:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # UI text for CmdsCore values, shared with the iOS app (docs/internals/localization.md).
      - Shared/Sources
      - path: App/Resources
        optional: true
    dependencies:
      - package: CmdsCore
      - package: Sparkle
      # The `cmds` CLI ships at cmds.app/Contents/Resources/bin/cmds (PATH of spawned terminals, "Install Command Line Tool…").
      - target: cmds-cli
        embed: true
        codeSign: true
        copy:
          destination: resources
          subpath: bin
      # The widget (#96), in cmds.app/Contents/PlugIns.
      - target: CmdsWidget
        embed: true
        codeSign: true
      - framework: vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Carbon.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: IOSurface.framework
      - sdk: CoreText.framework
      - sdk: WebKit.framework
      - sdk: Network.framework
      - sdk: CoreBluetooth.framework
      - sdk: UserNotifications.framework
      - sdk: WidgetKit.framework
      # The voice assistant (#243, macOS 26+): weakly linked, FoundationModels does not exist before macOS 26.
      - sdk: Speech.framework
        weak: true
      - sdk: FoundationModels.framework
        weak: true
      - sdk: libc++.tbd
    info:
      path: App/Info.plist
      properties:
        # "cmds" / "cmds Dev" (CMDS_APP_NAME below).
        CFBundleName: $(CMDS_APP_NAME)
        CFBundleDisplayName: $(CMDS_APP_NAME)
        # Support folder in ~/Library/Application Support: "cmds" / "cmds-dev" (CMDS_SUPPORT_FOLDER below, #247).
        CMDSSupportFolderName: $(CMDS_SUPPORT_FOLDER)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: cmds syncs terminals to the iOS companion over the local network.
        NSBonjourServices: [_cmds._tcp]
        NSBluetoothAlwaysUsageDescription: cmds lets the iOS companion connect over Bluetooth when Wi‑Fi is off. The connection stays end-to-end encrypted.
        # Programs running in a terminal are attributed to cmds by macOS privacy prompts (see App/cmds.entitlements).
        NSAppleEventsUsageDescription: A program running in cmds would like to use AppleScript.
        # Also the voice assistant (#243), which listens for its name when the user turns it on.
        NSMicrophoneUsageDescription: cmds' assistant listens for its name when you turn it on, or a program running in cmds would like to use the microphone.
        NSSpeechRecognitionUsageDescription: cmds' assistant recognises what you say to it on this Mac. Nothing heard is stored.
        # Siri and Shortcuts (#282): "cmds" is not a word Siri knows, so the phrases ("cmdsの状況", "Ask cmds") also take
        # these spoken names.
        INAlternativeAppNames:
          - INAlternativeAppName: Commands
            INAlternativeAppNamePronunciationHint: commands
          - INAlternativeAppName: C M D S
            INAlternativeAppNamePronunciationHint: see em dee ess
          - INAlternativeAppName: シーエムディーエス
            INAlternativeAppNamePronunciationHint: しーえむでぃーえす
          - INAlternativeAppName: コマンズ
            INAlternativeAppNamePronunciationHint: こまんず
        NSCameraUsageDescription: A program running in cmds would like to use the camera.
        NSContactsUsageDescription: A program running in cmds would like to access your contacts.
        NSCalendarsUsageDescription: A program running in cmds would like to access your calendars.
        NSLocationUsageDescription: A program running in cmds would like to use your location.
        NSPhotoLibraryUsageDescription: A program running in cmds would like to access your photo library.
        # Automatic updates (App/Sources/App/Updater.swift, docs/internals/release.md#automatic-updates): a daily check
        # of the appcast, which must carry an EdDSA signature like every update, made with the key whose public half
        # is SUPublicEDKey; updates are downloaded automatically and verified before they are extracted.
        SUFeedURL: https://cmds.n-n.tokyo/download/appcast.xml
        SUPublicEDKey: WRrXlNY/+sRmJsGwhqdOmjexcbSTwEe837Mx3WWFgNQ=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 86400
        # cmds://workspace/<id>, opened by the widget (#96, AppDelegate.application(_:open:)); cmds-dev:// for Debug
        # builds (CMDS_URL_SCHEME below).
        # http/https: cmds can be chosen as the default browser and opens those URLs in a browser pane. Apple requires
        # it of apps holding the passkeys entitlement for browsers (#162, com.apple.developer.web-browser.public-key-credential).
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(CMDS_URL_SCHEME)]
          - CFBundleURLName: Web site URL
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [http, https]
    settings:
      base:
        PRODUCT_NAME: cmds
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds
        CMDS_APP_NAME: cmds
        CMDS_URL_SCHEME: cmds
        CMDS_SUPPORT_FOLDER: cmds
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/cmds.entitlements
        ENABLE_HARDENED_RUNTIME: NO
        # A stable signing identity keeps the firewall allowance and notification permission across rebuilds.
        DEVELOPMENT_TEAM: LY354RVYHA
        CODE_SIGN_IDENTITY: "Apple Development"
        OTHER_LDFLAGS: ["-lc++"]
        ARCHS: arm64
      configs:
        # Debug builds are a separate app to macOS (#236): privacy (TCC) grants, LaunchServices (URL scheme, default
        # browser, widget) and UserDefaults are keyed by bundle identifier, so a development-signed build with the
        # release's identifier took over the release's grants. Release keeps tokyo.n-n.cmds (Developer ID, passkeys).
        # They also keep their data in their own support folder (#247): macOS reopened a Debug build after a restart
        # without its CMDS_SUPPORT_DIR, and it restored the release's workspaces and agent sessions.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.dev
          CMDS_APP_NAME: cmds Dev
          CMDS_URL_SCHEME: cmds-dev
          CMDS_SUPPORT_FOLDER: cmds-dev
        # Release builds run under the hardened runtime (required for notarization). They are still signed with
        # "Apple Development" here so local Release builds need no keychain prompt; scripts/release/build-dmg.sh
        # re-signs the app with the Developer ID certificate for distribution (docs/internals/release.md).
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Bundle Ghostty resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/vendor/ghostty/zig-out/share"
          DST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          mkdir -p "$DST"
          for d in ghostty terminfo; do
            if [ -d "$SRC/$d" ]; then rsync -a --delete "$SRC/$d/" "$DST/$d/"; fi
          done
  CmdsWidget:
    # The widget (#96): reads widget.json from cmds' support folder (WidgetSnapshot). Sandboxed, with read access to
    # that one file only.
    type: app-extension
    platform: macOS
    sources:
      - Widget/Sources
      - path: Widget/Resources
        optional: true
    dependencies:
      - package: CmdsCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: $(CMDS_APP_NAME)
        # The app's support folder, where widget.json is (#247).
        CMDSSupportFolderName: $(CMDS_SUPPORT_FOLDER)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/CmdsWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Read-only, the one file the app writes for it (paths relative to the real home folder). Expanded when
        # signing: cmds in Release, cmds-dev in Debug (#247).
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/$(CMDS_SUPPORT_FOLDER)/widget.json
    settings:
      base:
        PRODUCT_NAME: CmdsWidget
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.widget
        CMDS_APP_NAME: cmds
        CMDS_SUPPORT_FOLDER: cmds
        DEVELOPMENT_TEAM: LY354RVYHA
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: NO
        ARCHS: arm64
        SKIP_INSTALL: YES
      configs:
        # An extension's identifier must start with its app's (#236, tokyo.n-n.cmds.dev for Debug).
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.dev.widget
          CMDS_APP_NAME: cmds Dev
          CMDS_SUPPORT_FOLDER: cmds-dev
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  cmds-cli:
    # Same sources as the SwiftPM `cmds` executable, built by Xcode so plain xcodebuild can bundle it.
    type: tool
    productName: cmds
    platform: macOS
    sources:
      - Packages/CmdsCore/Sources/cmds-cli
    dependencies:
      - package: CmdsCore
    # Merged into the generated Info.plist: the CLI bundled in a Debug build talks to that build's socket in
    # ~/Library/Application Support/cmds-dev by default (#247).
    info:
      path: App/CLI-Info.plist
      properties:
        CMDSSupportFolderName: $(CMDS_SUPPORT_FOLDER)
        # XcodeGen would otherwise write 1.0 / 1, which win over the generated values.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_NAME: cmds
        PRODUCT_MODULE_NAME: cmds_cli
        # `cmds --version` (#16): an Info.plist with MARKETING_VERSION in the binary, read through Bundle.main.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CMDS_SUPPORT_FOLDER: cmds
        ARCHS: arm64
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
      configs:
        Debug:
          CMDS_SUPPORT_FOLDER: cmds-dev
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  CmdsCompanion:
    type: application
    platform: iOS
    sources:
      - iOS/Sources
      - Shared/Sources
      - iOS/Resources
    dependencies:
      - package: CmdsCore
      - package: CmdsSSH
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: cmds
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocalNetworkUsageDescription: cmds connects to your Mac to mirror terminals.
        NSBonjourServices: [_cmds._tcp]
        NSCameraUsageDescription: cmds scans the pairing QR code shown by cmds on your Mac.
        NSBluetoothAlwaysUsageDescription: cmds connects to your Mac over Bluetooth when it cannot reach it over Wi‑Fi. The connection stays end-to-end encrypted.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.companion
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: LY354RVYHA
        TARGETED_DEVICE_FAMILY: "1,2"
  CmdsDeviceDriver:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - iOS/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tokyo.n-n.cmds.devicedriver
        DEVELOPMENT_TEAM: LY354RVYHA
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
