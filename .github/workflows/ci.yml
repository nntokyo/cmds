# Checks for every pull request and for master (docs/internals/ci.md). The same jobs run locally with
# scripts/ci/run-local.sh when GitHub Actions is unavailable or out of minutes.
name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    name: Website and update feed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # One download per release, not per run: every download adds to the release's public download count.
      - name: Release DMG from an earlier run
        uses: actions/cache@v6
        with:
          path: build/ci-dmg
          key: release-dmg-${{ hashFiles('site/public/download/appcast.xml') }}
      - name: Pages, appcast signature, download links and the release DMG
        run: python3 -I scripts/ci/site_check.py --release --dmg-cache build/ci-dmg
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Markdown links
        run: python3 -I scripts/check-links.py

  swift:
    name: Swift packages and String Catalogs
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: String Catalogs compile
        run: scripts/ci/run-local.sh strings
      - name: CmdsCore (library, CLI and their tests)
        working-directory: Packages/CmdsCore
        run: swift test
      - name: CmdsSSH (unit tests)
        working-directory: Packages/CmdsSSH
        run: swift test

  ios:
    name: iOS companion builds
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version && xcrun --sdk iphonesimulator --show-sdk-version
      - name: XcodeGen
        run: brew install xcodegen
      # The companion compiles against CmdsCore, which the Mac app changes most (#373). No signing, no simulator run.
      - name: Build CmdsCompanion for the iOS Simulator
        run: scripts/ci/run-local.sh ios
